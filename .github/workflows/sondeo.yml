name: Sondeo de fuentes

on:
  workflow_dispatch:
    inputs:
      lista:
        description: "Archivo con las URLs a probar"
        default: "scripts/sondeo-urls.txt"

jobs:
  sondeo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/sondeo.py "${{ github.event.inputs.lista }}"
