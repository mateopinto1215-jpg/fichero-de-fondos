name: Actualizar fondos y publicar

on:
  schedule:
    # Lunes a viernes 15:15 y 21:15 en Buenos Aires (18:15 y 00:15 UTC).
    # ArgentinaDatos actualiza los FCI a media tarde con los valores del día hábil anterior.
    - cron: "15 18 * * 1-5"
    - cron: "15 0 * * 2-6"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Probar el lector de fichas
        run: python scripts/test_parser.py

      - name: Bajar datos (ArgentinaDatos, fuente CAFCI/CNV)
        run: python scripts/argentinadatos.py

      - name: Guardar historial de cuotapartes
        run: |
          git config user.name "fichero-bot"
          git config user.email "fichero-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios en el historial"
          else
            git commit -m "Datos CAFCI $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi

      - name: Versionar archivos de la web (evita que el navegador muestre una versión vieja)
        run: sed -i "s/__V__/${GITHUB_RUN_NUMBER}/g" site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: actualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
