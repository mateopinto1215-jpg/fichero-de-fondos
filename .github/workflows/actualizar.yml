name: Actualizar fondos y publicar

on:
  # Programación pausada: CAFCI bloquea las IPs de GitHub (CloudFront 403). Ver README.
  # schedule:
    # Martes a sábado 02:15 UTC = lunes a viernes 23:15 en Buenos Aires (CAFCI publica a la noche)
    # - cron: "15 2 * * 2-6"
    # Repaso a la mañana (09:15 Buenos Aires) por si CAFCI publicó tarde
    # - cron: "15 12 * * 2-6"
  workflow_dispatch:
    inputs:
      limite:
        description: "Procesar solo N clases (0 = todas). Útil para pruebas."
        required: false
        default: "0"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Probar el lector de fichas
        run: python scripts/test_parser.py

      - name: Bajar datos de CAFCI
        run: python scripts/cafci.py --limit "${{ github.event.inputs.limite || '0' }}"

      - name: Guardar historial de cuotapartes
        run: |
          git config user.name "fichero-bot"
          git config user.email "fichero-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios en el historial"
          else
            git commit -m "Datos CAFCI $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: actualizar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
